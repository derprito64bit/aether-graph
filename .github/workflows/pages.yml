name: pages

# Publishes the site to GitHub Pages at
# https://derprito64bit.github.io/aether-graph-prompting-design-test/ on every push to main.
# CI (ci.yml) gates main through pull requests; this only builds and ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, never a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for the /aether-graph-prompting-design-test/ base
        run: npm run build
        env:
          BASE_PATH: /aether-graph-prompting-design-test/
      - run: node scripts/pages-fallback.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
